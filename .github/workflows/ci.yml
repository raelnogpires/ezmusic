name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: RustSec dependency audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --all-targets --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

  linux-artifact:
    timeout-minutes: 30
    needs: [audit, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ezmusic-linux-x86_64
          path: target/release/ezmusic
