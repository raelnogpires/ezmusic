[package]
name = "ezmusic"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A performance-first terminal music downloader and player"
license = "MIT"

[features]
default = ["bundled-opus"]
bundled-opus = ["symphonia-adapter-libopus/bundled"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.16"
crossbeam-channel = "0.5"
crossterm = "0.28"
directories = "6.0"
libc = "0.2"
rand = "0.9"
ratatui = "0.29"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
symphonia = { version = "0.6", default-features = false, features = ["aac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
symphonia-adapter-libopus = { version = "0.3", default-features = false }
toml = "0.9"
ureq = { version = "2.12", features = ["json", "tls"] }
url = "2.5"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"

[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
